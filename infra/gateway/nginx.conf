# API Gateway — Nginx
# MVP 1: proxy simples para decision-api
# MVP 5: adicionar auth, rate limiting, observabilidade

events {
    worker_connections 1024;
}

http {
    upstream decision_api {
        server decision-api:8000;
    }

    server {
        listen 80;

        location /api/ {
            proxy_pass http://decision_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Correlation-ID $request_id;
        }

        location /health {
            proxy_pass http://decision_api/health;
        }

        location /docs {
            proxy_pass http://decision_api/docs;
        }
    }
}
