# Redis configuration — MVP 3
# Usado para: cache, idempotência por transaction_id, rate limiting

# Limite de memória (ajustar conforme ambiente)
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistência (RDB snapshot)
save 900 1
save 300 10
save 60 10000

# Timeout de conexão
timeout 300

# Log level
loglevel notice
